services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: entregas
      POSTGRES_USER: entregas
      POSTGRES_PASSWORD: entregas_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregas -d entregas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: